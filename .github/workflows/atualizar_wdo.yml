name: Atualizar Painel WDO

on:
  schedule:
    # Horários em UTC (Brasília = UTC - 3)
    # 08:50 BRT = 11:50 UTC (Pré-abertura)
    # 10:15, 11:15, 12:15, 13:15 BRT = 13:15, 14:15, 15:15, 16:15 UTC (Janelas PTAX)
    # 18:35 BRT = 21:35 UTC (Fechamento)
    - cron: '50 11 * * 1-5'
    - cron: '15 13,14,15,16 * * 1-5'
    - cron: '35 21 * * 1-5'
  workflow_dispatch: # Permite disparar o botão manual 'Run workflow' quando você quiser

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          pip install gspread pandas yfinance requests beautifulsoup4 python-bcb lxml

      - name: Executar Atualização da Planilha
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python atualizar_wdo.py
